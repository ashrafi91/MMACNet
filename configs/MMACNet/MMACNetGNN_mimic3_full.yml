paths:
  mimic_dir: &mimic_dir ${MIMIC_CSV_DIR:-datasets/mimic3/csv}
  static_dir: &static_dir ${MIMIC_STATIC_DIR:-datasets/mimic3/static}
  dataset_dir: &dataset_dir datasets/mimic3_full
  word2vec_dir: &word2vec_dir datasets/mimic3_full/word2vec
  output_dir: &output_dir results/MMACNetGNN_mimic3

dataset:
  name: base_dataset
  data_common: &data_common
    column_names:
      hadm_id: "HADM_ID"
      clinical_note: "TEXT"
      labels: "LABELS"
    word2vec_dir: *word2vec_dir
    pad_token: "<pad>"
    unk_token: "<unk>"
    dataset_dir: *dataset_dir
    label_file: labels.json
    max_length: 1500
  params:
    train:
      <<: *data_common
      data_file: train.json
    val:
      <<: *data_common
      data_file: val.json
    test:
      <<: *data_common
      data_file: test.json

model:
  name: MMACNetGNN
  params:
    version: mimic3
    dataset_dir: *dataset_dir
    mimic_dir: *mimic_dir
    static_dir: *static_dir
    word2vec_dir: *word2vec_dir
    num_classes: 568
    embed_size: 100
    kernel_size: 50
    num_filter_maps: 50
    dropout: 0.6
    fc_dropout: 0.3
    lmbda: 0.0  # Positive for DR-CAML
    init_code_emb: false
    pad_token: "<pad>"
    unk_token: "<unk>"
    conv_block_depth: 3
    fc_layer_dims: [1024, 568]
    use_batch_norm: True
    conv_activation: relu
    tabular_hidden_dim: 50
    tabular_fusion: "late"
    # Label graph encoder settings (new)
    label_encoder_type: dir   # options: gcn (default), dir, gps
    label_graph_path: datasets/mimic3_full/label_graph.npy
    label_graph_use_desc_embeddings: false
    label_graph_hidden_dims: [128, 128]
    label_graph_activation: relu
    label_global_heads: 4
    label_graph_dropout: 0.3
    label_edge_dropout: 0.05
    label_stochastic_depth: 0.0
    label_query_use_text_summary: true
trainer:
  name: base_trainer
  params:
    output_dir: *output_dir
    data_loader:
      batch_size: 32
      num_workers: 8
      shuffle: false
      drop_last: true
    loss:
      name: CrossEntropyLoss
      params: null
    optimizer:
      name: adam
      params:
        lr: 0.0005
        weight_decay: 0.0
    max_epochs: 200
    lr_scheduler: 
      name: cosineanneal
      params: 
        T_max: 200
    stopping_criterion:
      metric:
        name: prec_at_8
      desired: max
      patience: 15
    checkpoint_saver:
      name: base_saver
      params:
        checkpoint_dir: *output_dir
        interval: 1
        max_to_keep: 5
        ckpt_fname_format: "ckpt-{}.pth"
        best_fname_format: "best-{}.pth"
        metric:
          name: prec_at_8
          class: prec_at_k
          params:
            k: 8
        desired: max
    eval_metrics: 
      - name: prec_at_8
        class: prec_at_k
        params:
          k: 8
      - name: prec_at_15
        class: prec_at_k
        params:
          k: 15
      - name: macro_f1
      - name: micro_f1
      - name: macro_auc
      - name: micro_auc
    graph:
      writer:
        name: tensorboard
        params:
          log_dir: *output_dir
      train:
        interval: 100
        interval_unit: step
        metric:
          - name: loss
      val:
        interval: 1
        interval_unit: epoch
        metric:
          - name: loss
          - name: prec_at_8
          - name: prec_at_15
          - name: macro_f1
          - name: micro_f1
          - name: macro_auc
          - name: micro_auc
    seed: 1337
    use_gpu: true
